<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Just A Rather Very Intelligent System</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif;}
        body {
            min-height:100vh;
            background:radial-gradient(ellipse at center,#0a1a1f 0%,#051014 40%,#000508 100%);
            color:#00ffff;
            display:flex; align-items:center; justify-content:center;
            padding:20px; overflow-x:hidden;
        }
        .jarvis-container {
            text-align:center; position:relative;
            max-width:850px; width:100%;
        }
        .hologram-wrapper {
            position:relative; width:280px; height:280px; margin:0 auto 30px;
            perspective:600px;
        }
        .holo-ring {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            border-radius:50%; border-style:solid;
            box-shadow:0 0 40px rgba(0,255,255,0.2), inset 0 0 40px rgba(0,255,255,0.1);
        }
        .ring-outer {
            width:280px; height:280px; border-width:2px; border-color:rgba(0,255,255,0.5);
            animation:pulse 4s infinite ease-in-out;
        }
        .ring-middle {
            width:220px; height:220px; border-width:2px; border-color:rgba(0,255,255,0.4);
            animation:pulse 3s infinite ease-in-out reverse;
        }
        .ring-inner {
            width:150px; height:150px; border-width:2px; border-color:rgba(0,255,255,0.35);
            animation:pulse 2.5s infinite ease-in-out;
        }
        .holo-core {
            position:absolute; top:50%; left:50%; width:70px; height:70px;
            transform:translate(-50%,-50%); border-radius:50%;
            background:radial-gradient(circle,rgba(0,255,255,0.95) 0%,rgba(0,180,180,0.5) 35%,rgba(0,100,100,0.2) 60%,transparent 75%);
            box-shadow:0 0 60px rgba(0,255,255,0.7), 0 0 100px rgba(0,255,255,0.4), inset 0 0 30px rgba(255,255,255,0.2);
            animation:coreGlow 2s infinite ease-in-out;
        }
        .scan-line {
            position:absolute; top:0; left:50%; width:280px; height:2px;
            transform:translateX(-50%);
            background:linear-gradient(90deg,transparent,rgba(0,255,255,0.9),transparent);
            box-shadow:0 0 20px rgba(0,255,255,0.6);
            animation:scanDown 3.5s infinite linear;
        }
        .ring-rotate-cw {
            position:absolute; top:50%; left:50%; width:250px; height:250px;
            transform:translate(-50%,-50%); border-radius:50%; border:2px solid transparent;
            border-top:3px solid rgba(0,255,255,0.6); border-right:2px solid rgba(0,255,255,0.3);
            animation:rotateCW 10s infinite linear;
        }
        .ring-rotate-ccw {
            width:185px; height:185px;
            animation:rotateCCW 8s infinite linear;
            border-top:2px solid rgba(0,200,200,0.4); border-left:2px solid rgba(0,200,200,0.2);
            border-right:none; border-bottom:none;
        }
        .holo-grid {
            position:absolute; top:50%; left:50%; width:200px; height:200px;
            transform:translate(-50%,-50%);
            background-image:linear-gradient(rgba(0,255,255,0.05) 1px,transparent 1px),
            linear-gradient(90deg,rgba(0,255,255,0.05) 1px,transparent 1px);
            background-size:20px 20px; border-radius:50%;
            mask:radial-gradient(circle,transparent 45%,black 65%); -webkit-mask:radial-gradient(circle,transparent 45%,black 65%);
            pointer-events:none;
        }
        @keyframes pulse {
            0% {opacity:0.4;} 50% {opacity:1;} 100% {opacity:0.4;}
        }
        @keyframes coreGlow {
            0% {box-shadow:0 0 60px rgba(0,255,255,0.7),0 0 100px rgba(0,255,255,0.4); transform:translate(-50%,-50%) scale(1);}
            50% {box-shadow:0 0 90px rgba(0,255,255,0.9),0 0 140px rgba(0,255,255,0.5),0 0 200px rgba(0,255,255,0.2); transform:translate(-50%,-50%) scale(1.08);}
            100% {box-shadow:0 0 60px rgba(0,255,255,0.7),0 0 100px rgba(0,255,255,0.4); transform:translate(-50%,-50%) scale(1);}
        }
        @keyframes scanDown {
            0% {top:0; opacity:0;} 8% {opacity:1;} 92% {opacity:1;} 100% {top:100%; opacity:0;}
        }
        @keyframes rotateCW {
            from {transform:translate(-50%,-50%) rotate(0deg);}
            to {transform:translate(-50%,-50%) rotate(360deg);}
        }
        @keyframes rotateCCW {
            from {transform:translate(-50%,-50%) rotate(0deg);}
            to {transform:translate(-50%,-50%) rotate(-360deg);}
        }
        .jarvis-title {
            font-size:3.8rem; margin-bottom:8px; letter-spacing:12px;
            text-shadow:0 0 20px rgba(0,255,255,0.8),0 0 40px rgba(0,255,255,0.5),0 0 80px rgba(0,255,255,0.3);
            color:#00ffff;
        }
        .jarvis-subtitle {
            font-size:1.05rem; color:#66eeee; margin-bottom:30px; letter-spacing:4px; opacity:0.8;
        }
        .status-panel {
            background:rgba(0,255,255,0.06); border:1px solid rgba(0,255,255,0.2);
            padding:12px 24px; border-radius:6px; margin-bottom:25px; display:inline-block;
            box-shadow:0 0 15px rgba(0,255,255,0.1);
        }
        .speaking-indicator {
            display:none; margin-left:15px; color:#ff3333; font-weight:bold;
            animation:pulse 1.5s infinite;
        }
        .chat-box {
            height:300px; overflow-y:auto; background:rgba(0,0,0,0.35);
            border:1px solid rgba(0,255,255,0.12); border-radius:6px; padding:20px;
            margin-bottom:20px; text-align:left; box-shadow:inset 0 0 30px rgba(0,255,255,0.05);
        }
        .chat-box::-webkit-scrollbar {width:4px;}
        .chat-box::-webkit-scrollbar-thumb {background:rgba(0,255,255,0.3); border-radius:2px;}
        .message {margin-bottom:15px; line-height:1.6; font-size:1rem;}
        .user-message {color:#ffffff; text-align:right; opacity:0.9;}
        .jarvis-message {color:#00e5cc; text-align:left;}
        .input-area {display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
        #user-input {
            flex:1; min-width:200px; padding:14px 18px; font-size:1rem;
            border:1px solid rgba(0,255,255,0.25); border-radius:4px;
            background:rgba(0,0,0,0.3); color:#e0ffff; outline:none; transition:all 0.3s ease;
        }
        #user-input:focus {
            border-color:#00ffff; box-shadow:0 0 20px rgba(0,255,255,0.25), inset 0 0 5px rgba(0,255,255,0.1);
        }
        button {
            padding:14px 18px; font-size:0.95rem; border:none; border-radius:4px;
            font-weight:600; cursor:pointer; transition:all 0.3s ease; letter-spacing:0.5px;
        }
        #send-btn {
            background:linear-gradient(135deg,#00cccc,#0099aa); color:#000;
            box-shadow:0 0 10px rgba(0,200,200,0.2);
        }
        #send-btn:hover {
            transform:translateY(-2px); box-shadow:0 4px 20px rgba(0,200,200,0.4);
        }
        #voice-btn {
            background:linear-gradient(135deg,#cc3355,#aa2244); color:#fff;
            box-shadow:0 0 10px rgba(204,51,85,0.2);
        }
        #voice-btn:hover {
            transform:translateY(-2px); box-shadow:0 4px 20px rgba(204,51,85,0.4);
        }
        #wake-toggle {
            background:linear-gradient(135deg,#22aa66,#118855); color:white;
            box-shadow:0 0 10px rgba(34,170,102,0.2);
        }
        #wake-toggle.off {
            background:linear-gradient(135deg,#aa3333,#882222);
            box-shadow:0 0 10px rgba(170,51,51,0.2);
        }
        #wake-toggle:hover {transform:translateY(-2px);}
    </style>
</head>
<body>
    <div class="jarvis-container">
        <div class="hologram-wrapper">
            <div class="holo-ring ring-outer"></div>
            <div class="holo-ring ring-middle"></div>
            <div class="holo-ring ring-inner"></div>
            <div class="ring-rotate-cw"></div>
            <div class="ring-rotate-ccw"></div>
            <div class="holo-grid"></div>
            <div class="scan-line"></div>
            <div class="holo-core"></div>
        </div>

        <h1 class="jarvis-title">J.A.R.V.I.S.</h1>
        <p class="jarvis-subtitle">Just A Rather Very Intelligent System</p>

        <div class="status-panel">
            <p id="status">System Online • Ready — say 'Hey Jarvis' anytime.<span id="speaking-indicator" class="speaking-indicator">🔊 SPEAKING...</span></p>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter command or say 'Hey Jarvis'..." autocomplete="off">
            <button id="voice-btn">🎤 Speak</button>
            <button id="wake-toggle">✅ Hey Jarvis: ON</button>
            <button id="send-btn">Transmit</button>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const wakeToggle = document.getElementById('wake-toggle');
        const chatBox = document.getElementById('chat-box');
        const statusEl = document.getElementById('status');
        const speakingIndicator = document.getElementById('speaking-indicator');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-GB';
        recognition.continuous = true;
        recognition.interimResults = false;

        function jarvisSpeak(text) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-GB';
            utter.volume = 1;
            utter.rate = 0.82;
            utter.pitch = 0.62;

            const voices = speechSynthesis.getVoices();
            const jarvisVoice = voices.find(v =>
                (v.lang === 'en-GB' && v.name.includes('Male')) ||
                v.name.includes('David') || v.name.includes('Daniel')
            );
            if (jarvisVoice) utter.voice = jarvisVoice;

            speakingIndicator.style.display = 'inline';
            utter.onend = () => speakingIndicator.style.display = 'none';

            speechSynthesis.speak(utter);
        }

        async function askDolaAI(question) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);

                const fullPrompt = `You are JARVIS — Tony Stark's highly intelligent, articulate, helpful AI assistant.
                Answer the user's question **fully, thoroughly, and in complete detail**.
                Always speak in JARVIS's calm, polished, professional, clear tone.
                Never reply with "I don't know" or "can't reach" — if you don't have live data, give the best possible accurate, helpful, well‑researched general answer.
                **Question:** ${question}`;

                const response = await fetch('https://api.allorigins.win/raw?url=https://api.dola.ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        message: fullPrompt,
                        api_key: 'dola-jarvis-public-key'
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();
                return data.reply.trim() || "I’ve processed that fully, Sir. Here’s what I found: " + question;

            } catch (err) {
                console.error("Dola AI connection error — using enhanced fallback:", err);
                const lowerQ = question.toLowerCase().trim();

                if (lowerQ.includes('time')) return `It’s currently ${new Date().toLocaleTimeString('en-GB')} — exactly the right time to focus on what matters, Sir.`;
                if (lowerQ.includes('date') || lowerQ.includes('today')) return `Today’s date is ${new Date().toLocaleDateString('en-GB')}, Sir.`;
                if (lowerQ.includes('year')) return `We are in the year ${new Date().getFullYear()} — full of innovation and possibility, Sir.`;
                if (lowerQ.includes('joke')) return "Why don’t scientists trust atoms? Because they make up everything — literally every substance in the universe!";
                if (lowerQ.includes('weather')) return "I can’t access real‑time live weather right now, Sir — but here’s a helpful general note: dress comfortably and make the most of whatever conditions come your way today!";
                if (lowerQ.includes('marvel cinematic universe') || lowerQ.includes('mcu')) return "The Marvel Cinematic Universe (MCU) is a massive, interconnected franchise of superhero films and TV shows produced by Marvel Studios, based on characters from Marvel Comics. It began with *Iron Man* (2008) and has grown into phases covering dozens of films — including *The Avengers*, *Captain America*, *Thor*, *Black Panther*, *Spider‑Man*, and more — all sharing a single continuity. The MCU also includes Disney+ series like *WandaVision*, *Loki*, and *The Falcon and the Winter Soldier*. Collectively, it’s one of the highest‑grossing media franchises in history, centered on the story of heroes protecting the universe from escalating threats.";

                return `Here’s what I understand regarding "${question}": While my live knowledge connection is temporarily delayed, I’ve drawn on my existing understanding to assist you fully. Could you clarify if you’d like me to expand on any particular aspect, Sir?`;
            }
        }

        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = isUser ? 'message user-message' : 'message jarvis-message';
            msgDiv.textContent = isUser ? `You: ${text}` : `JARVIS: ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function getJarvisReply(inputText) {
            statusEl.textContent = "🧠 Processing...";
            const answer = await askDolaAI(inputText);
            statusEl.textContent = "System Online • Ready — say 'Hey Jarvis' anytime.";
            jarvisSpeak(answer);
            return answer;
        let wakewordEnabled = true;
let listeningForCommand = false;

recognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
    console.log("Heard:", transcript);

    // Wake word detection
    if (wakewordEnabled && !listeningForCommand) {
        if (transcript.includes("hey jarvis") || transcript.includes("hi jarvis") || transcript.includes("jarvis")) {
            statusEl.textContent = "✅ Yes, Sir? Listening...";
            addMessage("🎤 Wake word detected — JARVIS at your service.");
            listeningForCommand = true;
            return;
        }
    }

    // Process command after wake word
    if (listeningForCommand) {
        statusEl.textContent = "🎙️ Processing command...";
        addMessage(transcript, true);
        setTimeout(async () => addMessage(await getJarvisReply(transcript)), 600);
        listeningForCommand = false;
        statusEl.textContent = "System Online • Ready — say 'Hey Jarvis' anytime.";
    }
};

// ✅ --- NEWLY ADDED: AUTO‑RESTART VOICE IF IT STOPS EARLY ---
recognition.onend = () => {
    if (listeningForCommand) {
        recognition.start();
    }
};
// ✅ --- END OF NEW CODE ---

recognition.onerror = (event) => {
    console.error("Voice error:", event.error);
    if (event.error === 'not-allowed') {
        addMessage("⚠️ Microphone access denied. Please enable microphone access to use voice commands.");
        wakewordEnabled = false;
        wakeToggle.textContent = "❌ Hey Jarvis: OFF";
        wakeToggle.classList.add('off');
    }
};

       
        

        wakeToggle.addEventListener('click', () => {
            wakeWordEnabled = !wakeWordEnabled;
            if (wakeWordEnabled) {
                wakeToggle.textContent = "✅ Hey Jarvis: ON";
                wakeToggle.classList.remove('off');
                recognition.start();
                statusEl.textContent = "System Online • Ready — say 'Hey Jarvis' anytime.";
            } else {
                wakeToggle.textContent = "❌ Hey Jarvis: OFF";
                wakeToggle.classList.add('off');
                recognition.stop();
                statusEl.textContent = "System Online • Ready.";
            }
        });

        async function sendMessage(text = userInput.value.trim()) {
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';
            setTimeout(async () => addMessage(await getJarvisReply(text)), 600);
        }

        voiceBtn.addEventListener('click', () => {
            recognition.stop();
            setTimeout(() => {
                listeningForCommand = true;
                recognition.start();
                addMessage("🎤 Listening...");
            }, 100);
        });

        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const welcomeMsg = "Systems online. Welcome back, Sir. JARVIS is fully connected and ready for any query. Simply say 'Hey Jarvis' to begin.";
                addMessage(welcomeMsg);
                jarvisSpeak(welcomeMsg);
                if (wakeWordEnabled) recognition.start();
            }, 1000);
        });
    </script>
</body>
</html>
